<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelSense — Your Movie Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0B0E14;
      --surface: #141822;
      --surface-raised: #1B2130;
      --text: #ECE8DD;
      --text-muted: #8A93A6;
      --gold: #D4A64A;
      --teal: #3FA796;
      --rule: #2A3040;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 900px 500px at 15% -5%, rgba(212, 166, 74, 0.16), transparent 60%),
        radial-gradient(ellipse 800px 500px at 85% 15%, rgba(63, 167, 150, 0.13), transparent 60%),
        radial-gradient(ellipse 1000px 600px at 50% 100%, rgba(63, 167, 150, 0.08), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    body::before {
      /* film grain */
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    body::after {
      /* vignette */
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      box-shadow: inset 0 0 180px 60px rgba(0, 0, 0, 0.55);
    }

    .screen {
      display: none;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    .dotfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: radial-gradient(circle, rgba(212, 166, 74, 0.28) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
      pointer-events: none;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--teal);
      font-size: 12px;
    }

    h1.title,
    h2.title {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.06em;
      margin: 0;
      color: var(--gold);
      text-shadow: 0 0 24px rgba(212, 166, 74, 0.35);
    }

    h1.title {
      font-size: clamp(56px, 11vw, 108px);
      line-height: 0.95;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.08em;
      font-size: 20px;
      background: var(--gold);
      color: #1a1406;
      border: none;
      border-radius: 8px;
      padding: 14px 34px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(212, 166, 74, 0.3);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--rule);
    }

    #screen-welcome {
      position: relative;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    #screen-welcome .content {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .subtitle {
      margin: 18px 0 34px;
      color: var(--text-muted);
      font-size: 16.5px;
      line-height: 1.6;
    }

    .tmdb-field {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tmdb-field label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .tmdb-field input {
      width: 280px;
      max-width: 80vw;
      background: var(--surface);
      border: 1px solid var(--rule);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
    }

    .tmdb-field input:focus {
      outline: none;
      border-color: var(--teal);
    }

    #screen-quiz {
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .quiz-card {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 40px 36px;
    }

    .progress-row {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .progress-dot {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--rule);
      transition: background 0.25s ease;
    }

    .progress-dot.done {
      background: var(--gold);
    }

    .progress-dot.current {
      background: var(--teal);
    }

    .q-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .q-text {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 24px;
      line-height: 1.3;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option {
      background: var(--surface-raised);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 16px 18px;
      text-align: left;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }

    .option:hover {
      border-color: var(--teal);
      transform: translateY(-1px);
    }

    .option.selected {
      border-color: var(--gold);
      background: rgba(212, 166, 74, 0.1);
      color: var(--gold);
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 28px;
    }

    #screen-results {
      padding: 48px 24px 96px;
      align-items: center;
    }

    .results-wrap {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .results-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .results-header h2.title {
      font-size: clamp(36px, 6vw, 52px);
    }

    #retake {
      margin-top: 8px;
    }

    .metrics {
      max-width: 620px;
      margin: 0 auto 36px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .metric-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      color: var(--teal);
      line-height: 1;
    }

    .metric-label {
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .ticket {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: rise 0.4s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .poster {
      position: relative;
      height: 170px;
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
      overflow: hidden;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
      mix-blend-mode: overlay;
      opacity: 0.5;
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent 65%);
    }

    .poster-initial {
      position: absolute;
      top: 8px;
      right: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 46px;
      color: rgba(255, 255, 255, 0.18);
      line-height: 1;
      z-index: 0;
    }

    .poster-rank {
      position: relative;
      z-index: 1;
      font-family: 'IBM Plex Mono', monospace;
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px 8px;
      border-radius: 999px;
      backdrop-filter: blur(2px);
    }

    .ticket-main {
      padding: 16px 20px 16px;
    }

    .ticket-rank {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .ticket-title {
      font-size: 18px;
      font-weight: 700;
      margin: 6px 0 10px;
      line-height: 1.3;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      color: var(--teal);
      border: 1px solid rgba(63, 167, 150, 0.4);
      background: rgba(63, 167, 150, 0.08);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .perforation {
      position: relative;
      border-top: 1px dashed var(--rule);
      margin: 4px 0;
    }

    .perforation::before,
    .perforation::after {
      content: "";
      position: absolute;
      top: -8px;
      width: 16px;
      height: 16px;
      background: var(--bg);
      border-radius: 50%;
    }

    .perforation::before {
      left: -8px;
    }

    .perforation::after {
      right: -8px;
    }

    .ticket-stub {
      padding: 14px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      line-height: 1;
    }

    .score-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .explanation {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
      flex: 1;
    }

    #status {
      text-align: center;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      margin-bottom: 24px;
    }

    #status.error {
      color: #E0796B;
    }

    footer {
      text-align: center;
      padding: 28px 24px;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
    }

    footer a {
      color: var(--teal);
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .options {
        grid-template-columns: 1fr;
      }

      .quiz-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="dotfield"></div>

  <section id="screen-welcome" class="screen active">
    <div class="content">
      <div class="eyebrow">Your movie companion</div>
      <h1 class="title">REELSENSE</h1>
      <p class="subtitle">Comm'on Amigo lets finalize which movie you wanna watch.</p>
      <button class="btn" id="start-btn">Let's Begin</button>
      <!-- <div class="tmdb-field">
        <label for="tmdb-key">OMDb API key (optional, enables real posters)</label>
        <input type="text" id="tmdb-key" placeholder="Paste your OMDb API key here">
      </div> -->
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="quiz-card">
      <div class="progress-row" id="progress-row"></div>
      <div class="q-count" id="q-count">Question 1 of 5</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="quiz-nav">
        <button class="btn ghost" id="back-btn">Back</button>
      </div>
    </div>
  </section>

  <section id="screen-results" class="screen">
    <div class="results-wrap">
      <div class="results-header">
        <div class="eyebrow">Your picks</div>
        <h2 class="title">TONIGHT'S SCREENING</h2>
        <div><button class="btn ghost" id="retake">Retake the quiz</button></div>
      </div>
      <div id="status"></div>
      <div class="metrics" id="metrics" style="display:none;">
        <div class="metric-card">
          <div class="metric-value" id="m-diversity">–</div>
          <div class="metric-label">Diversity of picks</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="m-coverage">–</div>
          <div class="metric-label">Catalog explored</div>
        </div>
      </div>
      <div class="grid" id="results"></div>
    </div>
  </section>

  <footer>
    Enjoy your movie night and Don't thank me &nbsp;·&nbsp; Author: Tarun Chowdary Yegi &nbsp;·&nbsp;
    <a href="https://github.com/Tarun-Chowdary/ReelSense" target="_blank">GitHub</a>
  </footer>

  <script>
    const API = "https://reelsense-ajru.onrender.com/api";
  
    async function fetchPosterUrl(imdbId) {
        const key = "cf3e1d7";

        if (!imdbId) return null;

        try {
          const res = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${key}`);

          if (!res.ok) return null;

          const data = await res.json();

          return (data.Poster && data.Poster !== "N/A")
            ? data.Poster
            : null;
        } catch (err) {
          console.error(err);
          return null;
        }
      }

    const QUESTIONS = [
      {
        key: "mood",
        text: "What's your mood tonight?",
        options: [
          { value: "feel_good", label: "Feel-good" },
          { value: "intense", label: "Intense" },
          { value: "thoughtful", label: "Thoughtful" },
          { value: "scared", label: "Up for a scare" },
          { value: "romantic", label: "Romantic" },
        ],
      },
      {
        key: "genre",
        text: "Which genre are you craving most?",
        options: [
          { value: "Action", label: "Action" },
          { value: "Comedy", label: "Comedy" },
          { value: "Drama", label: "Drama" },
          { value: "Sci-Fi", label: "Sci-Fi" },
          { value: "Horror", label: "Horror" },
          { value: "Romance", label: "Romance" },
          { value: "Adventure", label: "Adventure" },
          { value: "Animation", label: "Animation" },
        ],
      },
      {
        key: "pace",
        text: "How do you like your movies paced?",
        options: [
          { value: "fast", label: "Fast & action-packed" },
          { value: "slow", label: "Slow & character-driven" },
          { value: "either", label: "Doesn't matter" },
        ],
      },
      {
        key: "era",
        text: "Any era you're in the mood for?",
        options: [
          { value: "classics", label: "Classics (pre-1980)" },
          { value: "80s_90s", label: "80s–90s" },
          { value: "2000s_2010s", label: "2000s–2010s" },
          { value: "new", label: "New releases" },
          { value: "no_preference", label: "No preference" },
        ],
      },
      {
        key: "discovery",
        text: "Popular favorites, or hidden gems?",
        options: [
          { value: "popular", label: "Crowd favorites" },
          { value: "hidden", label: "Hidden gems" },
          { value: "mix", label: "Surprise me with a mix" },
        ],
      },
    ];

    let current = 0;
    const answers = {};

    const screens = {
      welcome: document.getElementById("screen-welcome"),
      quiz: document.getElementById("screen-quiz"),
      results: document.getElementById("screen-results"),
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
      window.scrollTo(0, 0);
    }

    document.getElementById("start-btn").addEventListener("click", () => {
      current = 0;
      renderQuestion();
      showScreen("quiz");
    });

    document.getElementById("retake").addEventListener("click", () => {
      for (const k in answers) delete answers[k];
      current = 0;
      renderQuestion();
      showScreen("quiz");
    });

    function renderProgress() {
      const row = document.getElementById("progress-row");
      row.innerHTML = QUESTIONS.map((_, i) => {
        const cls = i < current ? "done" : (i === current ? "current" : "");
        return `<div class="progress-dot ${cls}"></div>`;
      }).join("");
    }

    function renderQuestion() {
      const q = QUESTIONS[current];
      document.getElementById("q-count").textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      document.getElementById("q-text").textContent = q.text;
      renderProgress();

      const optionsEl = document.getElementById("options");
      optionsEl.innerHTML = q.options.map(opt => `
    <button class="option ${answers[q.key] === opt.value ? 'selected' : ''}" data-value="${opt.value}">
      ${opt.label}
    </button>
  `).join("");

      optionsEl.querySelectorAll(".option").forEach(btn => {
        btn.addEventListener("click", () => {
          answers[q.key] = btn.dataset.value;
          optionsEl.querySelectorAll(".option").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          setTimeout(() => {
            if (current < QUESTIONS.length - 1) {
              current++;
              renderQuestion();
            } else {
              submitQuiz();
            }
          }, 180);
        });
      });

      document.getElementById("back-btn").style.visibility = current === 0 ? "hidden" : "visible";
    }

    document.getElementById("back-btn").addEventListener("click", () => {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    });

    async function submitQuiz() {
      showScreen("results");
      const status = document.getElementById("status");
      const metrics = document.getElementById("metrics");
      const results = document.getElementById("results");
      status.classList.remove("error");
      status.textContent = "Reading your answers and screening the catalog…";
      metrics.style.display = "none";
      results.innerHTML = "";

      try {
        const res = await fetch(`${API}/quiz-recommend?k=10`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(answers),
        });
        if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
        const data = await res.json();

        if (!data.recommendations.length) {
          status.textContent = "No movies matched that exact combination — try different answers.";
          return;
        }

        status.textContent = `${data.recommendations.length} picks, built from your answers.`;
        metrics.style.display = "grid";
        document.getElementById("m-diversity").textContent = data.metrics.intraListDiversity;
        document.getElementById("m-coverage").textContent = (data.metrics.catalogCoverage * 100).toFixed(2) + "%";

        results.innerHTML = data.recommendations.map((r, i) => `
      <div class="ticket" style="animation-delay:${i * 0.03}s">
        <div class="poster" id="poster-${i}" style="background:${posterGradient(r.title, r.genres)}">
          <span class="poster-initial">${escapeHtml(posterInitial(r.title))}</span>
          <span class="poster-rank">PICK ${String(i + 1).padStart(2, "0")}</span>
        </div>
        <div class="ticket-main">
          <div class="ticket-title">${escapeHtml(r.title)}</div>
          <div class="chips">${r.genres.map(g => `<span class="chip">${escapeHtml(g)}</span>`).join("")}</div>
        </div>
        <div class="perforation"></div>
        <div class="ticket-stub">
          <div>
            <div class="score">${r.avgRating ?? "–"}</div>
            <div class="score-label">${r.avgRating ? `Avg rating (${r.ratingCount})` : "Unrated"}</div>
          </div>
          <div class="explanation">${escapeHtml(r.explanation)}</div>
        </div>
      </div>
    `).join("");

        // Swap in real posters where available; generated gradient stays as fallback.
        // Swap in real posters where available; generated gradient stays as fallback.
        data.recommendations.forEach(async (r, i) => {
          const url = await fetchPosterUrl(r.imdbId);
          if (!url) return;

          const el = document.getElementById(`poster-${i}`);
          if (el) {
            el.style.backgroundImage = `url('${url}')`;
            el.style.backgroundSize = "cover";
            el.style.backgroundPosition = "center";
          }
        });
      } catch (e) {
        status.classList.add("error");
        status.textContent = e.message;
      }
    }

    // Genre-themed color pairs used to build a generated "poster" gradient.
    // Real posters aren't in the MovieLens dataset, so each ticket gets a
    // consistent, genre-colored gradient instead (same movie -> same look).
    const GENRE_COLORS = {
      Action: ["#8C2A2A", "#2A0E0E"],
      Adventure: ["#B5762A", "#2A1A08"],
      Animation: ["#2A7A8C", "#0C2530"],
      Children: ["#3F9E8C", "#0E2A26"],
      Comedy: ["#B58A2A", "#2A2008"],
      Crime: ["#3A3A46", "#0E0E14"],
      Documentary: ["#4A5A4A", "#131A13"],
      Drama: ["#5A3A6E", "#170E1F"],
      Fantasy: ["#5A2A8C", "#180830"],
      "Film-Noir": ["#2E2E2E", "#0A0A0A"],
      Horror: ["#6E1A1A", "#1A0505"],
      Musical: ["#8C2A6E", "#260C1D"],
      Mystery: ["#2A3A6E", "#0A1020"],
      Romance: ["#8C2A5A", "#260C18"],
      "Sci-Fi": ["#1A6E8C", "#052026"],
      Thriller: ["#3A2A6E", "#0F0A20"],
      War: ["#5A4A2A", "#191408"],
      Western: ["#8C5A2A", "#241708"],
    };
    const DEFAULT_COLORS = ["#2A3040", "#0B0E14"];

    function hashStr(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return h;
    }

    function posterGradient(title, genres) {
      const primary = genres.find(g => GENRE_COLORS[g]) ? GENRE_COLORS[genres.find(g => GENRE_COLORS[g])] : DEFAULT_COLORS;
      const angle = 25 + (hashStr(title) % 130);
      return `linear-gradient(${angle}deg, ${primary[0]}, ${primary[1]})`;
    }

    function posterInitial(title) {
      const clean = title.replace(/^(The|A|An)\s+/i, "").trim();
      return clean.charAt(0).toUpperCase();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }
  </script>
</body>
